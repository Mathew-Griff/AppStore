<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="To-Do">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>To-Do</title>
<style>
  :root {
    --bg: #f2f2f7; --card: #ffffff; --text: #000; --secondary: #8e8e93;
    --sep: rgba(60,60,67,.18); --blue: #007aff; --red: #ff3b30; --orange: #ff9500;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000; --card: #1c1c1e; --text: #fff; --secondary: #8e8e93;
      --sep: rgba(84,84,88,.6); --blue: #0a84ff; --red: #ff453a; --orange: #ff9f0a; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; }
  body { min-height: 100vh; padding: env(safe-area-inset-top) 0 calc(80px + env(safe-area-inset-bottom)); }

  header { padding: 8px 20px 0; }
  .toolbar { display: flex; justify-content: flex-end; height: 44px; align-items: center; }
  .link { background: none; border: 0; color: var(--blue); font: inherit; padding: 8px 0; cursor: pointer; }
  .link:disabled { color: var(--secondary); }
  h1 { font-size: 34px; font-weight: 700; letter-spacing: .37px; margin: 2px 0 2px; color: var(--blue); }
  .count { color: var(--secondary); font-size: 15px; margin-bottom: 14px; }

  .list { margin: 0 16px; background: var(--card); border-radius: 12px; overflow: hidden; list-style: none; padding: 0; }
  .list:empty { display: none; }
  .row { position: relative; overflow: hidden; }
  .row + .row .content::before { content: ""; position: absolute; top: 0; left: 52px; right: 0; height: .5px; background: var(--sep); }
  .delete { position: absolute; inset: 0 0 0 auto; width: 88px; background: var(--red); color: #fff;
    border: 0; font: inherit; font-weight: 500; visibility: hidden; }
  .row.swiping .delete { visibility: visible; }
  .content { position: relative; display: flex; align-items: center; gap: 12px; min-height: 48px;
    padding: 10px 16px; background: var(--card); transition: transform .25s ease; touch-action: pan-y; }
  .check { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid #c7c7cc;
    background: none; padding: 0; display: grid; place-items: center; cursor: pointer; transition: .15s; }
  .done .check { border-color: var(--blue); }
  .done .check::after { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--blue); }
  .text { flex: 1; border: 0; background: none; color: inherit; font: inherit; outline: none; padding: 2px 0; min-width: 0; }
  .done .text { color: var(--secondary); }

  .empty { text-align: center; color: var(--secondary); margin-top: 22vh; }
  .empty svg { width: 64px; height: 64px; opacity: .5; }

  .section { margin: 26px 32px 6px; font-size: 13px; text-transform: uppercase; color: var(--secondary); }

  footer { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 20px calc(10px + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--bg) 80%, transparent);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
  .add { display: flex; align-items: center; gap: 8px; color: var(--blue); font-weight: 600; font-size: 17px;
    background: none; border: 0; padding: 6px 0; cursor: pointer; }
  .add svg { width: 26px; height: 26px; }
</style>
</head>
<body>
  <header>
    <div class="toolbar"><button class="link" id="clear">Clear Completed</button></div>
    <h1>To-Do</h1>
    <div class="count" id="count"></div>
  </header>

  <ul class="list" id="open"></ul>
  <div class="section" id="doneLabel">Completed</div>
  <ul class="list" id="done"></ul>

  <div class="empty" id="empty">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <p>No Reminders</p>
  </div>

  <footer>
    <button class="add" id="add">
      <svg viewBox="0 0 26 26"><circle cx="13" cy="13" r="13" fill="currentColor"/><path d="M13 7v12M7 13h12" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
      New Reminder
    </button>
  </footer>

<script>
const KEY = 'todo-items-v1';
let items = [];
try { items = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { items = []; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {} };
const $ = id => document.getElementById(id);

function render(focusId) {
  const open = items.filter(i => !i.done), done = items.filter(i => i.done);
  $('open').replaceChildren(...open.map(row));
  $('done').replaceChildren(...done.map(row));
  $('doneLabel').style.display = done.length ? '' : 'none';
  $('empty').style.display = items.length ? 'none' : '';
  $('count').textContent = open.length ? `${open.length} remaining` : (items.length ? 'All done 🎉' : '');
  $('clear').disabled = !done.length;
  if (focusId) document.querySelector(`[data-id="${focusId}"] .text`)?.focus();
}

function row(item) {
  const li = document.createElement('li');
  li.className = 'row' + (item.done ? ' done' : '');
  li.dataset.id = item.id;
  li.innerHTML = `<button class="delete">Delete</button>
    <div class="content"><button class="check" aria-label="Complete"></button>
    <input class="text" enterkeyhint="done"></div>`;
  const input = li.querySelector('.text'), content = li.querySelector('.content');
  input.value = item.text;

  li.querySelector('.check').onclick = () => {
    item.done = !item.done;
    if (navigator.vibrate) navigator.vibrate(10);
    save(); setTimeout(render, 180);
    li.classList.toggle('done', item.done);
  };
  li.querySelector('.delete').onclick = () => remove(item.id);
  input.oninput = () => { item.text = input.value; save(); };
  input.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); input.blur(); } };
  input.onblur = () => { if (!item.text.trim()) remove(item.id); };

  // Swipe left to reveal Delete
  let x0 = null, dx = 0, open = false;
  content.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; dx = 0; content.style.transition = 'none'; li.classList.add('swiping'); }, { passive: true });
  content.addEventListener('touchmove', e => {
    if (x0 === null) return;
    dx = e.touches[0].clientX - x0 + (open ? -88 : 0);
    content.style.transform = `translateX(${Math.min(0, Math.max(-140, dx))}px)`;
  }, { passive: true });
  content.addEventListener('touchend', () => {
    content.style.transition = '';
    if (dx < -200) { remove(item.id); return; }
    open = dx < -44;
    content.style.transform = open ? 'translateX(-88px)' : '';
    if (!open) setTimeout(() => li.classList.remove('swiping'), 250);
    x0 = null;
  });
  return li;
}

function remove(id) { items = items.filter(i => i.id !== id); save(); render(); }

$('add').onclick = () => {
  const blank = items.find(i => !i.done && !i.text.trim());
  if (blank) return render(blank.id);
  const item = { id: Date.now().toString(36), text: '', done: false };
  items.push(item); render(item.id);
};
$('clear').onclick = () => { items = items.filter(i => !i.done); save(); render(); };

render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
